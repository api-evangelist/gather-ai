aid: gather-ai
name: Gather AI
description: 'Gather AI is a Physical AI platform for logistics that gives warehouses
  dock-to-dock inventory visibility. Cameras mounted on autonomous drones and forklifts
  capture inventory, and computer vision extracts structured data (LPNs, UPCs, lot
  codes, and free text) from the imagery. Its Sage AI engine analyzes operations and
  surfaces prioritized actions before each shift, while automated Workflows route tasks
  to the right personnel across integrated systems. The plug-and-play solution deploys
  in hours alongside existing warehouse management systems, serving manufacturing,
  healthcare, food & beverage, retail, and 3PL operations. Surfaced as a portfolio
  company of bain-capital-ventures and bloomberg-beta.'
